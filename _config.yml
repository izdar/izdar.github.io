title: "Muhammad Daniyal Pirwani Dar"
email: "your.email@stonybrook.edu"  # Replace with your email
description: >- 
  PhD Student at Stony Brook University working on network protocol security, previously at the University of Iowa working on Internet measurements.
baseurl: "" 
url: "https://yourusername.github.io"  # Replace with your GitHub username
github_username: yourusername  # Replace with your GitHub username

remote_theme: mmistakes/minimal-mistakes
plugins:
  - jekyll-remote-theme
# Social Media
twitter_username: yourhandle
linkedin_username: yourname
scholar_userid: your_scholar_id
orcid_id: your_orcid
github_repo: academicpages/academicpages

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
plugins:
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache
  - jekyll-paginate

paginate: 5
paginate_path: "/blog/page:num/"

collections:
  publications:
    output: true
    permalink: /publication/:path/
  teaching:
    output: true
    permalink: /teaching/:path/
  projects:
    output: true
    permalink: /project/:path/
  talks:
    output: true
    permalink: /talk/:path/
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
  - scope:
      path: ""
      type: teaching
    values:
      layout: teaching
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
    values:
      layout: single
      author_profile: true

author:
  name   : "Muhammad Daniyal Pirwani Dar"
  avatar : "/images/profile.jpg"  # Add your photo here
  bio    : "PhD student at Stony Brook University researching network protocol security"
  location: "Stony Brook, NY"
